<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title>مادة تدخل، وطاقة تساعد</title><desc>مواد وطاقة ونتائج البناء الضوئي في تبسيط تعليمي.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="#53627A"/></marker></defs><rect width="1200" height="720" rx="26" fill="#F5F8FC"/><g font-family="Tahoma,Arial,sans-serif"><text x="600" y="65" font-size="36" fill="#10182F" text-anchor="middle" direction="rtl" unicode-bidi="plaintext">مادة تدخل، وطاقة تساعد</text><rect x="850" y="190" width="280" height="100" rx="22" fill="#E7F3FF" stroke="#CCD9EB" stroke-width="2"/><text x="990" y="249" font-size="27" fill="#10182F" text-anchor="middle" direction="rtl" unicode-bidi="plaintext">ثاني أكسيد الكربون</text><rect x="850" y="390" width="280" height="100" rx="22" fill="#E7F3FF" stroke="#CCD9EB" stroke-width="2"/><text x="990" y="449" font-size="27" fill="#10182F" text-anchor="middle" direction="rtl" unicode-bidi="plaintext">ماء</text><rect x="430" y="290" width="300" height="150" rx="22" fill="#E4F2F0" stroke="#CCD9EB" stroke-width="2"/><text x="580" y="356" font-size="27" fill="#10182F" text-anchor="middle" direction="rtl" unicode-bidi="plaintext">البناء الضوئي</text><text x="580" y="392" font-size="27" fill="#10182F" text-anchor="middle" direction="rtl" unicode-bidi="plaintext">سلسلة تفاعلات</text><rect x="55" y="190" width="270" height="100" rx="22" fill="#E7F3FF" stroke="#CCD9EB" stroke-width="2"/><text x="190" y="249" font-size="27" fill="#10182F" text-anchor="middle" direction="rtl" unicode-bidi="plaintext">مركبات سكرية</text><rect x="55" y="390" width="270" height="100" rx="22" fill="#E7F3FF" stroke="#CCD9EB" stroke-width="2"/><text x="190" y="449" font-size="27" fill="#10182F" text-anchor="middle" direction="rtl" unicode-bidi="plaintext">أكسجين</text><line x1="835" y1="240" x2="745" y2="335" stroke="#53627A" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/><line x1="835" y1="440" x2="745" y2="390" stroke="#53627A" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/><line x1="415" y1="335" x2="340" y2="240" stroke="#53627A" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/><line x1="415" y1="390" x2="340" y2="440" stroke="#53627A" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="440" y="120" width="280" height="80" rx="22" fill="#FFF0DF" stroke="#CCD9EB" stroke-width="2"/><text x="580" y="169" font-size="27" fill="#10182F" text-anchor="middle" direction="rtl" unicode-bidi="plaintext">طاقة الضوء</text><line x1="580" y1="215" x2="580" y2="275" stroke="#EA580C" stroke-width="6" stroke-linecap="round" marker-end="url(#arrow)"/><text x="600" y="570" font-size="27" fill="#10182F" text-anchor="middle" direction="rtl" unicode-bidi="plaintext">الماء وثاني أكسيد الكربون: مواد تدخل في العملية</text><text x="600" y="620" font-size="27" fill="#C2410C" text-anchor="middle" direction="rtl" unicode-bidi="plaintext">الضوء: طاقة تساعد على حدوثها</text><text x="600" y="681" font-size="23" fill="#53627A" text-anchor="middle" direction="rtl" unicode-bidi="plaintext">تبسيط تعليمي؛ لا يعرض كل تفاعلات النبات أو احتياجاته</text></g></svg>