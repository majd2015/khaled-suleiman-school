<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title>القطرة قد تسلك أكثر من مسار</title><desc>ماء المطر يتفرع إلى جريان وتسرّب، ويعود بعضه إلى الهواء.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="#53627A"/></marker></defs><rect width="1200" height="720" rx="26" fill="#F5F8FC"/><g font-family="Tahoma,Arial,sans-serif"><text x="600" y="65" font-size="36" fill="#10182F" text-anchor="middle" direction="rtl" unicode-bidi="plaintext">القطرة قد تسلك أكثر من مسار</text><rect x="450" y="115" width="300" height="85" rx="22" fill="#E7F3FF" stroke="#CCD9EB" stroke-width="2"/><text x="600" y="166.5" font-size="27" fill="#10182F" text-anchor="middle" direction="rtl" unicode-bidi="plaintext">ماء المطر</text><rect x="800" y="305" width="320" height="100" rx="22" fill="#E7F3FF" stroke="#CCD9EB" stroke-width="2"/><text x="960" y="364" font-size="27" fill="#10182F" text-anchor="middle" direction="rtl" unicode-bidi="plaintext">جريان على السطح</text><rect x="80" y="305" width="320" height="100" rx="22" fill="#E7F3FF" stroke="#CCD9EB" stroke-width="2"/><text x="240" y="364" font-size="27" fill="#10182F" text-anchor="middle" direction="rtl" unicode-bidi="plaintext">دخول التربة</text><line x1="700" y1="215" x2="940" y2="290" stroke="#53627A" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/><line x1="500" y1="215" x2="245" y2="290" stroke="#53627A" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="800" y="525" width="320" height="85" rx="22" fill="#E7F3FF" stroke="#CCD9EB" stroke-width="2"/><text x="960" y="576.5" font-size="27" fill="#10182F" text-anchor="middle" direction="rtl" unicode-bidi="plaintext">مجرى أو تجمع مائي</text><line x1="960" y1="420" x2="960" y2="510" stroke="#53627A" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="70" y="525" width="310" height="85" rx="22" fill="#E7F3FF" stroke="#CCD9EB" stroke-width="2"/><text x="225" y="576.5" font-size="27" fill="#10182F" text-anchor="middle" direction="rtl" unicode-bidi="plaintext">تخزين ومياه جوفية</text><line x1="210" y1="420" x2="210" y2="510" stroke="#53627A" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="430" y="405" width="300" height="85" rx="22" fill="#E7F3FF" stroke="#CCD9EB" stroke-width="2"/><text x="580" y="456.5" font-size="27" fill="#10182F" text-anchor="middle" direction="rtl" unicode-bidi="plaintext">امتصاص النبات</text><line x1="410" y1="355" x2="465" y2="395" stroke="#53627A" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="430" y="580" width="300" height="75" rx="22" fill="#E7F3FF" stroke="#CCD9EB" stroke-width="2"/><text x="580" y="626.5" font-size="27" fill="#10182F" text-anchor="middle" direction="rtl" unicode-bidi="plaintext">عودة إلى الهواء</text><line x1="580" y1="505" x2="580" y2="565" stroke="#53627A" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/><text x="698" y="548" font-size="22" fill="#53627A" text-anchor="middle" direction="rtl" unicode-bidi="plaintext">نتح</text><line x1="790" y1="565" x2="745" y2="615" stroke="#53627A" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/><text x="785" y="630" font-size="22" fill="#53627A" text-anchor="middle" direction="rtl" unicode-bidi="plaintext">تبخّر</text><text x="600" y="699" font-size="23" fill="#53627A" text-anchor="middle" direction="rtl" unicode-bidi="plaintext">المسارات مبسطة؛ لا تعبّر عن نسب أو أزمنة ثابتة</text></g></svg>