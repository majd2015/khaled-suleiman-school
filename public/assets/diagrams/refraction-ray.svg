<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img"><title>لم ينكسر القلم؛ تغيّر مسار الضوء</title><defs><marker id="blue" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto"><path d="M0 0L10 5L0 10" fill="#2563EB"/></marker><marker id="violet" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto"><path d="M0 0L10 5L0 10" fill="#7C3AED"/></marker></defs><rect width="1200" height="720" rx="30" fill="#F5F8FC"/><g font-family="Tahoma,Arial,sans-serif"><text x="600" y="65" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-size="34" fill="#10182F" font-weight="700">لم ينكسر القلم؛ تغيّر مسار الضوء</text><rect x="60" y="370" width="1080" height="275" rx="16" fill="#DDF3FC"/><line x1="60" x2="1140" y1="370" y2="370" stroke="#0891B2" stroke-width="3"/><line x1="600" x2="600" y1="120" y2="630" stroke="#75849A" stroke-width="2" stroke-dasharray="8 8"/><path d="M420 610L600 370" fill="none" stroke="#2563EB" stroke-width="5" marker-end="url(#blue)"/><path d="M600 370L920 130" fill="none" stroke="#2563EB" stroke-width="5" marker-end="url(#blue)"/><text x="150" y="200" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-size="31" fill="#10182F" font-weight="400">الهواء</text><text x="150" y="500" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-size="31" fill="#10182F" font-weight="400">الماء</text><text x="475" y="145" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-size="22" fill="#53627A" font-weight="400">العمود المقام</text><text x="875" y="285" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-size="25" fill="#2451A2" font-weight="400">ضوء إلى العين</text><text x="370" y="500" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-size="25" fill="#2451A2" font-weight="400">شعاع داخل الماء</text><text x="600" y="690" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-size="24" fill="#10182F" font-weight="400">عند الخروج مائلًا من الماء إلى الهواء، يبتعد الشعاع عن العمود المقام.</text></g></svg>