<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img"><title>خصم فوق خصم: الأساس يتغيّر</title><defs><marker id="blue" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto"><path d="M0 0L10 5L0 10" fill="#2563EB"/></marker><marker id="violet" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto"><path d="M0 0L10 5L0 10" fill="#7C3AED"/></marker></defs><rect width="1200" height="720" rx="30" fill="#F5F8FC"/><g font-family="Tahoma,Arial,sans-serif"><text x="600" y="65" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-size="34" fill="#10182F" font-weight="700">خصم فوق خصم: الأساس يتغيّر</text><rect x="780" y="250" width="240" height="205" rx="26" fill="#E4EDFF" stroke="#FFFFFF" stroke-width="3"/><text x="900" y="340" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-size="64" fill="#10182F" font-weight="700">100</text><text x="900" y="405" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-size="21" fill="#10182F" font-weight="400">السعر الأصلي</text><rect x="480" y="250" width="240" height="205" rx="26" fill="#DEF3FA" stroke="#FFFFFF" stroke-width="3"/><text x="600" y="340" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-size="64" fill="#10182F" font-weight="700">80</text><text x="600" y="405" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-size="21" fill="#10182F" font-weight="400">بعد خصم 20%</text><rect x="180" y="250" width="240" height="205" rx="26" fill="#EDE6FF" stroke="#FFFFFF" stroke-width="3"/><text x="300" y="340" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-size="64" fill="#10182F" font-weight="700">72</text><text x="300" y="405" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-size="21" fill="#10182F" font-weight="400">بعد خصم 10% من 80</text><path d="M770 350H740" stroke="#2563EB" stroke-width="4" marker-end="url(#blue)"/><path d="M470 350H440" stroke="#2563EB" stroke-width="4" marker-end="url(#blue)"/><text x="900" y="520" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-size="26" fill="#10182F" font-weight="400">خصم أول: 20</text><text x="600" y="520" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-size="26" fill="#10182F" font-weight="400">خصم ثانٍ: 8</text><text x="300" y="520" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-size="26" fill="#10182F" font-weight="400">التوفير الكلي: 28</text><text x="600" y="620" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-size="32" fill="#2451A2" font-weight="700">100 × 0.8 × 0.9 = 72</text><text x="600" y="676" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-size="25" fill="#10182F" font-weight="400">مثال افتراضي بوحدات نقدية: التوفير 28%، وليس 30%.</text></g></svg>