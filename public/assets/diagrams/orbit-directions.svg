<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img"><title>كيف تنحني الحركة حول الأرض؟</title><defs><marker id="blue" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto"><path d="M0 0L10 5L0 10" fill="#2563EB"/></marker><marker id="violet" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto"><path d="M0 0L10 5L0 10" fill="#7C3AED"/></marker></defs><rect width="1200" height="720" rx="30" fill="#F5F8FC"/><g font-family="Tahoma,Arial,sans-serif"><text x="600" y="65" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-size="34" fill="#10182F" font-weight="700">كيف تنحني الحركة حول الأرض؟</text><circle cx="545" cy="375" r="190" fill="none" stroke="#B3BED2" stroke-width="3" stroke-dasharray="9 8"/><circle cx="545" cy="375" r="90" fill="#DDF3FC" stroke="#2563EB" stroke-width="3"/><circle cx="735" cy="375" r="16" fill="#7C3AED"/><path d="M715 375H640" stroke="#2563EB" stroke-width="5" marker-end="url(#blue)"/><path d="M735 355V175" stroke="#7C3AED" stroke-width="5" marker-end="url(#violet)"/><text x="545" y="385" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-size="30" fill="#10182F" font-weight="400">الأرض</text><text x="1000" y="205" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-size="27" fill="#6533AD" font-weight="700">السرعة اللحظية</text><text x="1000" y="244" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-size="23" fill="#53627A" font-weight="400">اتجاه مماس للمدار</text><text x="950" y="400" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-size="25" fill="#10182F" font-weight="400">القمر الصناعي</text><text x="660" y="440" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-size="24" fill="#2451A2" font-weight="400">الجاذبية نحو المركز</text><text x="370" y="600" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-size="23" fill="#53627A" font-weight="400">مسار دائري