<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img"><title>من المدخل إلى القرار ثم المخرج</title><desc>قراءة أقل من 30 تشغل المصباح؛ غير ذلك يطفئه.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="#53627A"/></marker></defs><rect width="1200" height="720" rx="26" fill="#F5F8FC"/><g font-family="Tahoma,Arial,sans-serif"><text x="600" y="65" font-size="36" fill="#10182F" text-anchor="middle" direction="rtl" unicode-bidi="plaintext">من المدخل إلى القرار ثم المخرج</text><rect x="840" y="180" width="290" height="110" rx="22" fill="#E7F3FF" stroke="#CCD9EB" stroke-width="2"/><text x="985" y="226" font-size="27" fill="#10182F" text-anchor="middle" direction="rtl" unicode-bidi="plaintext">قراءة الحسّاس</text><text x="985" y="262" font-size="27" fill="#10182F" text-anchor="middle" direction="rtl" unicode-bidi="plaintext">من صفر إلى مئة</text><rect x="430" y="180" width="300" height="110" rx="22" fill="#E7F3FF" stroke="#CCD9EB" stroke-width="2"/><text x="580" y="244" font-size="27" fill="#10182F" text-anchor="middle" direction="rtl" unicode-bidi="plaintext">هل القراءة أقل من 30؟</text><line x1="830" y1="235" x2="745" y2="235" stroke="#53627A" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/><line x1="510" y1="305" x2="510" y2="455" stroke="#53627A" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/><line x1="650" y1="305" x2="890" y2="455" stroke="#53627A" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/><text x="455" y="370" font-size="27" fill="#10182F" text-anchor="middle" direction="rtl" unicode-bidi="plaintext">نعم</text><text x="835" y="370" font-size="27" fill="#10182F" text-anchor="middle" direction="rtl" unicode-bidi="plaintext">لا</text><rect x="350" y="470" width="320" height="100" rx="22" fill="#DBF6F5" stroke="#CCD9EB" stroke-width="2"/><text x="510" y="529" font-size="27" fill="#10182F" text-anchor="middle" direction="rtl" unicode-bidi="plaintext">شغّل المصباح</text><rect x="760" y="470" width="320" height="100" rx="22" fill="#EEE7FF" stroke="#CCD9EB" stroke-width="2"/><text x="920" y="529" font-size="27" fill="#10182F" text-anchor="middle" direction="rtl" unicode-bidi="plaintext">أطفئ المصباح</text><rect x="45" y="385" width="260" height="165" rx="22" fill="#FFFFFF" stroke="#CCD9EB" stroke-width="2"/><text x="175" y="440.5" font-size="27" fill="#10182F" text-anchor="middle" direction="rtl" unicode-bidi="plaintext">عند 30</text><text x="175" y="476.5" font-size="27" fill="#10182F" text-anchor="middle" direction="rtl" unicode-bidi="plaintext">الشرط غير متحقق</text><text x="175" y="512.5" font-size="27" fill="#10182F" text-anchor="middle" direction="rtl" unicode-bidi="plaintext">النتيجة: إطفاء</text><text x="600" y="645" font-size="24" fill="#53627A" text-anchor="middle" direction="rtl" unicode-bidi="plaintext">المقياس للتدريب، وليس وحدة لقياس الإضاءة</text><text x="600" y="686" font-size="23" fill="#53627A" text-anchor="middle" direction="rtl" unicode-bidi="plaintext">هذا مخطط قرار، وليس مخطط توصيل كهربائي</text></g></svg>